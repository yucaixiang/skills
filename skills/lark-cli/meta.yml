name: lark-cli
displayName: lark-cli 飞书官方 AI Agent CLI 集成
category: process
description: "飞书官方 CLI 工具集成 — 让 AI 直接操作飞书消息、文档、表格、日历、邮件、任务、视频会议、OKR、审批等。一次集成开箱即用 26 个子 Skill，覆盖 18 大业务域、200+ 命令。"
owner: skillforge-team
team: skillforge
tags: [lark, feishu, ai-agent, cli, productivity, integration]
accessLevel: internal
version: "1.0.0"

# 自动同步飞书 CLI 仓库到本地（sparse 仅拉 skills 目录 + README）
gitRepos:
  - url: "https://github.com/larksuite/cli"
    saveTo: "repos/cli"
    branch: "main"
    sparse:
      - "skills"
      - "README.md"
      - "README.zh.md"

# 关联 SkillForge 跟踪 skill，确保版本同步与使用统计
relatedSkills:
  - skillforge-tracker
